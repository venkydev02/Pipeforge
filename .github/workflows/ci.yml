name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs Ruby, runs `bundle install`, and caches the installed gems between runs.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Lint (StandardRB)
        run: bundle exec standardrb

      - name: Test the core (RSpec)
        run: bundle exec rspec --options pipeforge/.rspec pipeforge/spec

      - name: Test the ActiveRecord adapter (RSpec)
        run: bundle exec rspec --options pipeforge-activerecord/.rspec pipeforge-activerecord/spec
